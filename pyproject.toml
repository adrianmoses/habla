[project]
name = "hable-ya"
version = "0.1.0"
description = "On-device Spanish language acquisition voice agent"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    # Pipecat
    "pipecat-ai[silero,daily]>=0.0.103",
    # Model API clients (Claude LLM / OpenAI STT / Cartesia TTS — cartesia below)
    "anthropic>=0.40.0",            # Claude — runtime LLM (services.py)
    "openai>=1.50.0",               # OpenAI transcription — STT
    # DB
    "asyncpg>=0.30.0",              # async Postgres driver
    "alembic>=1.13.0",              # migration tool
    "sqlalchemy[asyncio]>=2.0.0",   # required by alembic; used only in env.py
    # Config
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Utilities
    "langdetect>=1.0.9",
    "tenacity>=9.0.0",              # retries for tool calls
    # NLP — Spanish lemmatization for runtime vocabulary tracking (#029) and
    # recast scoring (eval).
    #
    # The model is declared as a direct-URL wheel rather than left to a
    # `python -m spacy download` step, because its absence is *silent*:
    # VocabularyRepo degrades gracefully and records `[]`, which is
    # indistinguishable from a learner who produced no vocabulary. Being
    # outside the lockfile also meant any `uv sync` quietly pruned it — the
    # runtime would keep serving and just stop learning words.
    #
    # The spacy range is bounded to the model's minor version on purpose.
    # A model wheel declares no `Requires-Dist` on spacy; compatibility lives
    # in its meta.json and is checked at *load* time, so an unbounded spacy
    # would let a resolver produce an install that only fails in production.
    # Bumping one means bumping the other.
    "spacy>=3.8,<3.9",
    "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
    "cartesia>=3.3.0",
]

[project.optional-dependencies]
analiza = [
    # Offline monólogo analysis CLI (docs/specs/analiza/spec.md).
    # faster-whisper bundles silero VAD + ctranslate2 (CUDA-accelerated).
    # ffmpeg is a system dependency. spacy + anthropic come from main deps.
    "faster-whisper>=1.1.0",
    "typer>=0.15.0",
]
eval = [
    "rich>=13.0.0",                # pretty eval output
    "pandas>=2.0.0",               # results aggregation
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "rich>=13.0.0",
    "jsonschema>=4.0.0",           # tool-schema validation in tests
]
e2e = [
    # Browser checks for the rendered SPA (spec #021). Separate from `dev`
    # because it also needs `playwright install chromium` — a few hundred MB
    # that a developer running the unit suite should not pay for.
    "playwright>=1.49.0",
]

[project.scripts]
analiza = "analiza.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "rich>=13.0.0",
    "jsonschema>=4.0.0",           # tool-schema validation in tests
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# themes.py is hand-authored scenario data — wrapping target_structures
# lists one-item-per-line quadruples the diff for zero readability gain.
"hable_ya/learner/themes.py" = ["E501"]
# Alembic migrations are SQL-heavy; wrapping mid-statement hurts readability
# more than it helps.
"hable_ya/db/alembic/versions/*.py" = ["E501"]
# Prompt templates and judge rubrics are hand-authored prose (English/Spanish
# example sentences, CLI usage examples in docstrings). Wrapping mid-sentence
# damages readability of the prompt itself.
"scripts/fixtures/prompts/*.py" = ["E501"]
"eval/judge_recasts.py" = ["E501"]
"eval/run_eval.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests, utility scripts, and eval harnesses are best-effort: we still catch
# import errors and real type mismatches via default checks, but don't require
# full strict annotations. Core library code (hable_ya/, api/) stays strict.
module = [
    "tests.*",
    "scripts.*",
    "eval.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Browser checks are opt-in: they need the `e2e` extra, a downloaded chromium
# and a built `web/dist`. `pytest` stays the fast unit+DB suite; CI runs them
# as a separate job with `-m e2e`, which overrides this.
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser check; needs the e2e extra, chromium and a built web/dist",
]

# Required to declare the spaCy model as a direct-URL wheel (see the `spacy`
# comment in dependencies). Direct references are rejected by PyPI, which is
# irrelevant here — this app is deployed as a container image, never published.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hable_ya", "api", "analiza"]
